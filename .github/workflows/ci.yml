name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install server dependencies
        run: |
          cd server
          npm install
      - name: Run server tests
        run: |
          cd server
          npm test

  client:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Install client dependencies
        run: |
          cd client
          npm install
      - name: Build client
        run: |
          cd client
          npm run build
